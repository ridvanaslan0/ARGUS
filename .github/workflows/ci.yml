name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++

      - name: build (unix)
        if: runner.os != 'Windows'
        run: sh build.sh

      - name: build (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: compile (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      - name: known-answer self-test
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=./build/argus.exe; else BIN=./build/argus; fi
          $BIN aes --selftest

      - name: NIST SP 800-22 battery
        shell: bash
        continue-on-error: true
        run: |
          # A 13-test battery at alpha=0.01 fails by chance roughly one run in
          # thirteen. It is reported, but it does not gate the build; the
          # known-answer vectors above are the deterministic check.
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=./build/argus.exe; else BIN=./build/argus; fi
          $BIN rng-test --bits 1048576 || echo "::warning::a statistical test fell below alpha (expected occasionally)"

      - name: tool smoke test
        if: runner.os == 'Linux'
        run: sh tests/smoke.sh build/argus

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.name }}
          path: |
            build/argus
            build/argus.exe
          if-no-files-found: error